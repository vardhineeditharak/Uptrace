<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 38" width="160" height="38" fill="none">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b63d3" />
      <stop offset="100%" stop-color="#98a4f7" />
    </linearGradient>
    <linearGradient id="logoSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#11121c" />
