    <circle cx="29" cy="17" r="2" fill="#ffffff" />
  </g>

  <!-- Wordmark Text -->
  <text x="47" y="25" fill="#ffffff" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.5px">Uptrace</text>
