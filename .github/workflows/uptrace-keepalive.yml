name: ⚡ Uptrace Keep-Alive & Auto Commit logs

on:
  schedule:
    # Runs every 12 hours (00:00, 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  keepalive-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Run Uptrace Keep-Alive Checks & Alerts
        env:
          TZ: 'Asia/Kolkata'
          TIMEZONE: 'Asia/Kolkata'
          TIMEZONE_CODE: 'IST'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_ENABLED: ${{ secrets.SMTP_ENABLED || 'true' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_SENDER_EMAIL: ${{ secrets.ALERT_SENDER_EMAIL }}
          ALERT_RECEIVER_EMAIL: ${{ secrets.ALERT_RECEIVER_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python run_monitor.py --no-commit || echo "Checks completed"

      - name: 📊 Commit & Push Status Report, History & Logs to GitHub
        env:
          TZ: 'Asia/Kolkata'
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL || 'vardhineedi.tharak@gmail.com' }}
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          git add -f STATUS.md data/ logs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes in status report."
          else
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S IST")
            git commit -m "chore(uptrace): automated keep-alive status sync [$TIMESTAMP]"
            git push origin HEAD
          fi
