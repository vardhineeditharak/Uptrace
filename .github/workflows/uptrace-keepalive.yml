name: ⚡ Uptrace Keep-Alive & Auto Commit logs

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to keep DBs/Apps awake and grow commit graph
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  keepalive-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Run Uptrace Keep-Alive Checks & Alerts
        env:
          SMTP_ENABLED: ${{ secrets.SMTP_ENABLED || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_SENDER_EMAIL: ${{ secrets.ALERT_SENDER_EMAIL }}
          ALERT_RECEIVER_EMAIL: ${{ secrets.ALERT_RECEIVER_EMAIL }}
        run: |
          python run_monitor.py --no-commit || echo "Checks completed with incidents reported"

      - name: 🌱 Commit & Push Status Report to GitHub
        run: |
          git config --global user.name "Uptrace Bot"
          git config --global user.email "uptrace-bot@users.noreply.github.com"
          git add STATUS.md data/ logs/
          if git diff --staged --quiet; then
            echo "No changes in status report."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(uptrace): automated keep-alive check & status report [$TIMESTAMP]"
            git push origin HEAD
          fi
